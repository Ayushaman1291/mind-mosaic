{% extends "base.html" %}
{% block title %}
Home
{% endblock %}

{% block content %}

<section class="photo-h">
    <div>
        <h1>Pictures of the ones you love</h1>
        <p>Let's Rewind memories</p>
    </div>
</section>

<section class="photo-card" style="justify-content: flex-start; align-items: stretch;">
    <form method="POST" enctype="multipart/form-data" class="photo-upload-form">
        <input type="file" name="photo" accept=".jpg,.jpeg,.png,.webp" required>
        <input type="text" name="caption" placeholder="Add a caption (optional)">
        <button type="submit">Upload photo</button>
    </form>

    {% if photos %}
        <div class="photo-gallery">
        {% for p in photos %}
            <figure class="photo-item">
                <img src="{{ p.photo_url }}" alt="{{ p.caption or 'Family photo' }}">
                {% if p.caption %}
                <figcaption>{{ p.caption }}</figcaption>
                {% endif %}
            </figure>
        {% endfor %}
        </div>
    {% else %}
        <p class="photo-empty">No photos yet. Upload your first memory above.</p>
    {% endif %}
</section>
{% endblock %}
