{% extends "base.html" %}
{% block title %}
Login
{% endblock %}
{% block content %}
<div class="auth-container">
<div class="page-header">
    <h1>{{ t('login_title') }}</h1>
    <p>{{ t('login_subtitle') }}</p>
</div>
<form method="POST" class="auth-form">
    <input type="email" name="email" placeholder="{{ t('login_email') }}" required>
    <input type="password" name="password" placeholder="{{ t('login_password') }}" required>
    <button type="submit">{{ t('login_button') }}</button>
</form>
<p class="auth-switch">{{ t('login_no_account') }}<a href="{{url_for('register')}}">{{ t('login_create_one') }}</a></p>
</div>
{% endblock %}
